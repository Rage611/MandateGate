name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Build, Typecheck, Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # next build runs its own TypeScript check AND generates .next/types/
        # (routes.d.ts, root-params.d.ts) which next-env.d.ts statically imports.
        # The subsequent typecheck step requires those files to exist, so build
        # must come first.
        run: npm run build
        env:
          # Supabase is not needed at build time — the health-check route
          # gracefully degrades when env vars are absent.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""

      - name: Typecheck
        # Runs tsc --noEmit for strict library-level type checking on top of
        # what next build already checked. Runs after build so .next/types/ exists.
        run: npm run typecheck

      - name: Lint
        run: npm run lint
